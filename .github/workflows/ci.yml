name: HRD Epistemic MCP Zero-Dependency Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Edge SOP (< 1MB file limit)
        run: |
          OVERSIZED=$(find . -not -path './.git/*' -type f -size +1M)
          if [ -n "$OVERSIZED" ]; then
            echo "ERROR: Oversized files found:"
            echo "$OVERSIZED"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-dependency unittest suite
        run: python3 -m unittest discover -s tests -v
